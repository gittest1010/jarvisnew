name: streaming_asr
description: Sherpa ONNX Voice Assistant with Official Integration
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- UTILITIES ---
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  path: ^1.9.0
  
  # Official Example Dependencies
  # Latest stable versions
  url_launcher: ^6.3.1
  
  # --- AUDIO RECORDING ---
  record: ^6.1.2

  # --- AUDIO PLAYBACK ---
  audioplayers: ^6.5.1
  
  # --- MEDIA KIT ---
  # Corrected latest stable versions as of Dec 2025
  media_kit: ^1.2.6
  # media_kit_libs_video version 1.0.7 is the latest stable that pairs with media_kit
  media_kit_libs_video: ^1.0.7

  # --- AI CORE ---
  sherpa_onnx: ^1.12.20
  
  # --- ZIP EXTRACTION ---
  archive: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # 1. STT Models
    - assets/tiny-encoder.int8.onnx
    - assets/tiny-decoder.int8.onnx
    - assets/tokens.txt
    
    # 2. TTS Models
    - assets/hi_IN-pratham-medium.onnx
    - assets/hi_IN-pratham-medium.onnx.json
    
    # 3. TTS Data
    - assets/espeak-ng-data.tar.bz2