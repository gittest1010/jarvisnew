name: streaming_asr
description: Jarvis AI - Offline Voice Assistant
publish_to: 'none'
version: 1.0.2

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Core
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  path: ^1.9.0

  # Audio
  record: ^6.1.2
  audioplayers: ^6.1.0

  # AI
  sherpa_onnx: ^1.10.27

  # Archive
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/stt-hi.tar.bz2
    - assets/tts-hi.tar.bz2